_base_: 'eigen_base.yaml'

#mode: test

training:
  seed: 512
  resume_from: null
  #resume_from: ./checkpoints_resnet101_yuhua_yes_50%/dct_eigen_pff/epoch=10-step=21230.ckpt
  work_dir: 'checkpoints_baseline_KITTI_50%'
  max_epochs: 100
  batch_size: 2
  num_workers: 8
  log_freq: 1024
  accumulate_grad_batches: 1
  precision: '16'

  find_unused_parameters: false
  gradient_clip_val: 1.0

dataset:
  phase: 3
  
model:
  type: 'BaselineModel'
  encoder: 'resnet101'

  #encoder: 'large12'
  #pretrain: './checkpoints_phase1/dct_eigen_phase1/dcdepth_logs/version0/checkpoints/epoch=37-step=14668.ckpt'
  #pretrain: './Models/swin/swin_large_patch4_window12_384_22k.pth'
  #pretrained_model_path: './checkpoints_phase2/dct_eigen_pff_phase2/model_train_phase2_loss_epoch029_score1.4658.pth'

  #ape: false
  drop_path_rate: 0.3
  drop_path_rate_crf: 0.3
  seq_dropout_rate: 0.3
  output_space: 'log'
  #feat_dim: 256
  #window_size: 7
  #sigma: 0.05
  #self_sup_threshold: 0.3
  #self_sup_ratio: 0.2
  #self_sup_weight: 0.5



loss:
  variance_focus: 0.85
  beta: 0.8
  freq_reg_weight: 0.005
  smooth_reg_weight: 0.005
  #wcl_weight: 0.1
  #depth_thresh: 0.1
  min_valid_pixels: 0
  square_root: true

optimization:
  max_lr: 1.0e-4
  div_factor: 5.0
  final_div_factor: 4.0
  pct_start: 0.1
  weight_decay: 0.0
  lr_ratio: 4.0
  anneal_strategy: 'cos'

evaluation:
  every_n_epochs: 1
