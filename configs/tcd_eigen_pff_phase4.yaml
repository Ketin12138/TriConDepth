_base_: 'eigen_base.yaml'

mode: test

training:
  seed: 512
  resume_from: null
  work_dir: 'checkpoints_KITTI_5%/checkpoints_phase4'
  max_epochs: 100
  batch_size: 2
  num_workers: 8
  log_freq: 1024
  accumulate_grad_batches: 1
  precision: '16'

  find_unused_parameters: true
  gradient_clip_val: 1.0

dataset:
  phase: 4

model:
  type: 'Stage4Model'
  encoder: 'resnet101'

  pretrained_model_path: './checkpoints_KITTI_5%/checkpoints_phase3/checkpoints_KITTI_phase3.ckpt'

  drop_path_rate: 0.3
  drop_path_rate_crf: 0.3
  seq_dropout_rate: 0.3
  output_space: 'log'



loss:
  variance_focus: 0.85
  beta: 0.8
  freq_reg_weight: 0.005
  smooth_reg_weight: 0.005
  min_valid_pixels: 0
  square_root: true
  encoder_consistency_weight: 0.01
  consistency_l1_weight: 0.005
  pseudo_weight: 0.05           
  pseudo_ramp_up_iters: 12000
  unsup_contrastive_weight: 0.001
  unsup_ranking_weight: 0.001 

optimization:
  max_lr: 1.0e-4
  div_factor: 5.0
  final_div_factor: 4.0
  pct_start: 0.1
  weight_decay: 0.0
  lr_ratio: 4.0
  anneal_strategy: 'cos'

evaluation:
  every_n_epochs: 1
